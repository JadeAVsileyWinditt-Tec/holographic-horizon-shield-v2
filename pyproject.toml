[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holographic-horizon-shield-v2"
version = "2.2.0"
description = "High-concurrency astrophysical API proxy for LLM prompt anomaly defense."
readme = "README.md"
authors = [{ name = "Jade Siley-Winditt", email = "developer@phoenixrisingseer.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Framework :: FastAPI"
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
workers = 4
loop = "asyncio"
http = "httptools"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
